# 로컬 개발용 Postgres.
#
#   docker-compose up -d     띄운다
#   docker-compose down      멈춘다 (데이터는 남는다)
#   docker-compose down -v   볼륨까지 지운다 (데이터가 사라진다)

# 프로젝트 이름을 못 박는다. 안 적으면 compose 가 디렉터리 이름(server)을 쓰고,
# 다른 레포의 server/ 에 있는 compose 와 컨테이너·볼륨을 공유하게 된다.
name: timesheet

services:
  db:
    image: postgres:18.6-alpine
    # 5432(board-api)·5433(course-rush) 가 이미 쓰이고 있어서 5434 로 연다.
    ports: ["5434:5432"]
    environment:
      POSTGRES_USER: timesheet
      POSTGRES_PASSWORD: timesheet
      POSTGRES_DB: timesheet
    # 18 이미지는 /var/lib/postgresql 아래에 메이저 버전별 디렉터리를 만든다.
    volumes: ["pgdata:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U timesheet -d timesheet"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
